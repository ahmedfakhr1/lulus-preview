<script>/* Season picker. Inlined in <head> by the build so the right palette is on screen
   before first paint. Seasons are data (data/seasons.json); every season ships with
   the page and the browser picks by today's date in Africa/Cairo.
   ?season=<id> previews any season (a short form such as ?season=winter also works). */
(function () {
  var DATA = {"def":{"id":"default","name":"","colours":{"bg":"#fdf9f3","ink":"#66461c","accent":"#db983e","accent2":"#7a0000"},"heroImage":"hero-fall.webp","heroTall":"hero-fall-tall.webp","heroAlt":"A guest with a table of LÜLU’S croissants and brioches","heroW":1620,"heroH":1080},"seasons":[{"id":"summer-2026","name":"Summer 2026","start":"2026-06-01","end":"2026-09-14","colours":{"bg":"#f5fbff","paper":"#fbfeff","ink":"#0449a6","accent":"#5dc4ff","accent2":"#2b93ff"},"heroImage":"hero-summer.webp","heroTall":"hero-summer-tall.webp","heroAlt":"A LÜLU’S summer table: fried calamari, salmon, mashed potatoes and lemons","heroW":1080,"heroH":720},{"id":"fall-2026","name":"Fall 2026","start":"2026-09-15","end":"2026-11-30","colours":{"bg":"#fdf9f3","paper":"#fefcfa","ink":"#66461c","accent":"#db983e","accent2":"#7a0000"},"heroImage":"hero-fall.webp","heroTall":"hero-fall-tall.webp","heroAlt":"A guest with a table of LÜLU’S croissants and brioches","heroW":1620,"heroH":1080},{"id":"winter-2026","name":"Winter 2026","start":"2026-12-01","end":"2027-01-31","colours":{"bg":"#fdfaf6","paper":"#fefdfb","ink":"#a00303","accent":"#ddac6a","accent2":"#0e4b02"},"heroImage":"","heroAlt":""},{"id":"valentine-2027","name":"Valentine 2027","start":"2027-02-01","end":"2027-02-07","colours":{"bg":"#fffcfe","paper":"#fffeff","ink":"#a40000","accent":"#ffc6f4","accent2":"#701818"},"heroImage":"hero-valentine.webp","heroTall":"hero-valentine-tall.webp","heroAlt":"A heart-shaped pizza on a LÜLU’S table","heroW":1620,"heroH":1080},{"id":"ramadan-2027","name":"Ramadan 2027","cover":"#4e5b00","start":"2027-02-08","end":"2027-03-09","colours":{"bg":"#fefcf9","paper":"#fffefd","ink":"#674a1f","accent":"#dfa143","accent2":"#a40407"},"heroImage":"hero-ramadan.webp","heroTall":"hero-ramadan-tall.webp","heroAlt":"A LÜLU’S Ramadan table set with palm plates and gold cutlery","heroW":1620,"heroH":1080},{"id":"spring-2027","name":"Spring 2027","start":"2027-03-10","end":"2027-05-31","colours":{"bg":"#fff2fe","paper":"#fffaff","ink":"#6b1263","accent":"#ff2bec","accent2":"#ffe38e"},"heroImage":"hero-spring.webp","heroTall":"hero-spring-tall.webp","heroAlt":"Two friends under the LÜLU’S sign on a sunny day","heroW":1620,"heroH":1080}]};
  var doc = document.documentElement;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function cairoToday() {
    try {
      var parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date());
      var o = {};
      for (var i = 0; i < parts.length; i++) o[parts[i].type] = parts[i].value;
      return o.year + '-' + o.month + '-' + o.day;
    } catch (e) {
      var d = new Date(Date.now() + 2 * 3600 * 1000);
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
    }
  }

  function rgb(h) {
    h = h.replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function mix(a, b, p) {
    return [a[0] * p + b[0] * (1 - p), a[1] * p + b[1] * (1 - p), a[2] * p + b[2] * (1 - p)];
  }
  function hex(c) {
    var s = '#';
    for (var i = 0; i < 3; i++) { var v = Math.round(Math.max(0, Math.min(255, c[i]))).toString(16); s += v.length < 2 ? '0' + v : v; }
    return s;
  }

  var today = cairoToday();
  var query = '';
  try { query = (new URLSearchParams(location.search).get('season') || '').toLowerCase(); } catch (e) {}

  var season = null, preview = '';
  if (query) {
    var all = DATA.seasons.concat([DATA.def]);
    for (var i = 0; i < all.length && !season; i++) if (all[i].id === query) season = all[i];
    for (var j = 0; j < all.length && !season; j++) if (all[j].id.indexOf(query + '-') === 0) season = all[j];
    if (season) preview = query;
  }
  if (!season) {
    for (var k = 0; k < DATA.seasons.length; k++) {
      var s = DATA.seasons[k];
      if (s.start <= today && today <= s.end) { season = s; break; }
    }
  }
  if (!season) season = DATA.def;

  var c = season.colours;
  var bg = rgb(c.bg), ink = rgb(c.ink), paper = rgb(c.paper || c.bg);
  var acc = rgb(c.accent), acc2 = rgb(c.accent2);
  var scrim = mix(ink, [0, 0, 0], 0.55);
  var black = [0, 0, 0];
  /* the menu page, by time of day: Morning is light, Evening is walnut and night (keep in step with tools/validate.py) */
  var deskDay = mix(bg, ink, 0.94);
  var deskNight = mix(ink, black, 0.34);
  var pageNight = mix(ink, black, 0.56);
  /* the menu cover wears the season's colour, but only one that keeps her cream wordmark readable (3:1, large text) */
  function lum(x) { return x.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }).reduce(function (a, v, i) { return a + v * [0.2126, 0.7152, 0.0722][i]; }, 0); }
  function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  var cover = season.cover || (ratio(paper, acc) >= 3 ? c.accent : ratio(paper, acc2) >= 3 ? c.accent2 : c.ink);
  /* the wordmark drawn in the home headline wears the first palette colour that reads on the page (3:1), by day and by night */
  function pick(list, ground, fallback) { for (var q = 0; q < list.length; q++) if (list[q] && ratio(rgb(list[q]), ground) >= 3) return list[q]; return fallback; }
  var popDay = pick([season.cover, c.accent, c.accent2], bg, hex(mix(acc, ink, 0.36)));
  var popNight = pick([c.accent, c.accent2, season.cover], deskNight, c.accent);
  var vars = {
    '--cover': cover,
    '--pop-day': popDay, '--pop-night': popNight,
    '--bg': c.bg, '--ink': c.ink, '--accent': c.accent, '--accent2': c.accent2,
    '--paper': c.paper || c.bg,
    '--muted': hex(mix(ink, bg, 0.80)),
    '--muted-paper': hex(mix(ink, paper, 0.80)),
    '--hair': hex(mix(ink, bg, 0.22)),
    '--hair-paper': hex(mix(ink, paper, 0.24)),
    '--tint': hex(mix(acc, bg, 0.24)),
    '--tint2': hex(mix(acc2, bg, 0.26)),
    '--desk': hex(mix(ink, black, 0.80)),
    '--desk-day': hex(deskDay),
    '--desk-night': hex(deskNight),
    '--page-night': hex(pageNight),
    '--muted-night': hex(mix(paper, pageNight, 0.78)),
    '--hair-night': hex(mix(paper, pageNight, 0.24)),
    /* the home page by evening: night surroundings, paper text */
    '--muted-desk': hex(mix(paper, deskNight, 0.66)),
    '--hair-desk': hex(mix(paper, deskNight, 0.2)),
    /* the chapter numerals by day: the accent, deepened with ink so it reads on the light page */
    '--acc-day': hex(mix(acc, ink, 0.36)),
    '--scrim': Math.round(scrim[0]) + ',' + Math.round(scrim[1]) + ',' + Math.round(scrim[2])
  };
  /* a flower seen from above, in three shades of the season colour, tiled behind the photos; it changes with the season */
  var fl1 = hex(mix(acc, paper, 0.5)), fl2 = c.accent, fl3 = hex(mix(acc2, ink, 0.25));
  function flower(x, y, r, k) {
    var g = '<g transform="translate(' + x + ' ' + y + ') rotate(' + r + ') scale(' + k + ')">', i;
    for (i = 0; i < 5; i++) g += '<path d="M0 -4C-26 -20 -22 -50 -6 -46C-2 -45 0 -40 0 -38C0 -40 2 -45 6 -46C22 -50 26 -20 0 -4Z" fill="' + fl1 + '" transform="rotate(' + (i * 72) + ')"/>';
    for (i = 0; i < 5; i++) g += '<path d="M0 -2C-12 -10 -10 -26 0 -24C10 -26 12 -10 0 -2Z" fill="' + fl2 + '" transform="rotate(' + (i * 72) + ')"/>';
    for (i = 0; i < 5; i++) g += '<circle cx="0" cy="-11" r="1.8" fill="' + fl3 + '" transform="rotate(' + (i * 72 + 36) + ')"/>';
    return g + '<circle r="6" fill="' + fl3 + '"/></g>';
  }
  /* scattered, not gridded: uneven spots, turns and sizes inside a 360 px tile, kept clear of its edges so it repeats without seams */
  var spots = [[52, 60, 8, 0.5], [196, 38, 47, 0.38], [300, 120, 20, 0.56], [128, 168, 63, 0.44], [40, 262, 34, 0.4], [232, 250, 12, 0.5], [318, 318, 55, 0.34], [150, 318, 28, 0.36]];
  var tile = '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">';
  for (var f = 0; f < spots.length; f++) tile += flower(spots[f][0], spots[f][1], spots[f][2], spots[f][3]);
  tile += '</svg>';
  vars['--flora'] = 'url("data:image/svg+xml,' + encodeURIComponent(tile) + '")';
  /* one blossom on its own, for the ones that turn slowly in place (app.js lays them out on the same spots) */
  vars['--bloom'] = 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">' + flower(0, 0, 0, 1) + '</svg>') + '")';
  window.LULUS_BLOOMS = spots;
  for (var key in vars) doc.style.setProperty(key, vars[key]);
  doc.setAttribute('data-season', season.id);
  doc.className += ' js';

  /* Morning or Evening: the menu page follows it. A choice made earlier in this visit wins, then the
     time in Cairo (Evening from 17:00 to 04:59), and a #morning / #evening link wins over both. */
  function cairoHour() {
    try {
      return parseInt(new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', hour: '2-digit', hour12: false }).format(new Date()), 10) % 24;
    } catch (e) { return new Date().getHours(); }
  }
  var service = '';
  try { service = sessionStorage.getItem('lulus-svc') || ''; } catch (e) {}
  var hashed = (location.hash || '').replace('#', '').toLowerCase();
  if (hashed === 'morning' || hashed === 'evening') service = hashed;
  if (service !== 'morning' && service !== 'evening') { var hr = cairoHour(); service = hr >= 5 && hr < 17 ? 'morning' : 'evening'; }
  doc.setAttribute('data-mood', service);

  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', /^menu/.test(location.pathname.split('/').pop() || '') ? (service === 'morning' ? hex(deskDay) : hex(deskNight)) : (service === 'morning' ? c.bg : hex(deskNight)));

  /* The hero photo: one portrait photo per season, shown at most as wide as its own pixels allow
     (see .hero-media in home.css). heroW / heroH come from the file itself at build time. */
  function heroHTML() {
    if (!season.heroImage) return '<i class="ph-img" aria-hidden="true"></i>';
    var alt = (season.heroAlt || '').replace(/"/g, '&quot;');
    var dims = season.heroW && season.heroH ? ' width="' + season.heroW + '" height="' + season.heroH + '"' : '';
    var focus = season.heroFocus ? ' style="object-position:' + season.heroFocus.replace(/"/g, '') + '"' : '';
    var img = '<img src="img/' + season.heroImage + '" alt="' + alt + '"' + dims + focus + ' fetchpriority="high" decoding="async">';
    /* a phone held upright gets the season's tall crop, so the photo can fill most of the first screen */
    return season.heroTall ? '<picture><source media="(max-width: 899px) and (orientation: portrait)" srcset="img/' + season.heroTall + '">' + img + '</picture>' : img;
  }
  function heroInto(el) {
    if (!el) return;
    el.insertAdjacentHTML('afterbegin', heroHTML());
    if (season.heroW && season.heroH) el.style.setProperty('--hero-r', (season.heroW / season.heroH).toFixed(4));
  }

  window.LULUS = {
    season: season,
    service: service,
    desks: { morning: hex(deskDay), evening: hex(deskNight) },
    today: today,
    preview: preview,
    seasons: DATA,
    heroHTML: heroHTML,
    heroInto: heroInto
  };
})();
</script>

<dialog class="sheet" id="reserve" aria-labelledby="reserve-title">
  <form id="reserve-form" method="dialog" novalidate>
    <div class="sheet-head">
      <h2 id="reserve-title">Reserve a table</h2>
      <button class="x" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
    </div>
    <div class="field">
      <label for="r-name">Name</label>
      <input id="r-name" name="name" type="text" autocomplete="name" required aria-describedby="r-name-e">
      <p class="err" id="r-name-e" hidden>Add your name.</p>
    </div>
    <div class="row2">
      <div class="field">
        <label for="r-date">Date</label>
        <input id="r-date" name="date" type="date" required aria-describedby="r-date-e">
        <p class="err" id="r-date-e" hidden>Choose a date.</p>
        <p class="day-first" id="r-date-d" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="r-time">Time</label>
        <input id="r-time" name="time" type="time" required aria-describedby="r-time-e">
        <p class="err" id="r-time-e" hidden>Choose a time.</p>
      </div>
    </div>
    <div class="field">
      <span class="lbl" id="r-guests-l">Guests</span>
      <div class="step" role="group" aria-labelledby="r-guests-l">
        <button type="button" data-step="-1" aria-label="Fewer guests">&minus;</button>
        <output id="r-guests" aria-live="polite">2</output>
        <button type="button" data-step="1" aria-label="More guests">+</button>
      </div>
    </div>
    <button class="btn btn-block" type="submit">Send on WhatsApp</button>
    <p class="fine">Opens WhatsApp with your details filled in.</p>
  </form>
</dialog>
