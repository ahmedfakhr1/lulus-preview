name: Publish menu
# Redraws the menu pages from the Google Sheet (words and prices) or from new PDFs pushed to menu-source/,
# and puts the Sheet's Seasons, Content and Photos tabs into the pages (new photos come from Google Drive).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'   # a backup; the Sheet's Apps Script starts this about a minute after an edit
  push:
    paths: ['menu-source/**']
permissions:
  contents: write
concurrency: { group: publish-menu, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet fonttools brotli pymupdf pillow pillow-heif numpy
      - name: New PDFs
        if: github.event_name == 'push'
        run: python3 tools/pdf_book.py
      - name: Words and prices from the Sheet
        if: github.event_name != 'push'
        run: python3 tools/sync_sheet.py
      - name: Save
        if: always()   # each part keeps its last good version when it fails, so the parts that worked are saved
        run: |
          git config user.name "Ahmed Fakhreldin"
          git config user.email "ahmedfakhr59@gmail.com"
          git add -A js/menu-pdf.js data img menu-source index.html menu.html
          git diff --cached --quiet || (git commit -m "Menu updated" && git push)
